[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind (not abort): an internal error in one action is caught and reported instead of closing the app.
panic = "unwind"
strip = true

# Geometry and clash checks are slow without optimisation; keep tests and dev runs usable.
[profile.dev.package.datum-core]
opt-level = 2
[profile.dev.package.parry3d-f64]
opt-level = 2
